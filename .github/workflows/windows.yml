# SPDX-License-Identifier: GPL-2.0-only
#
# The Windows half of the build: the tool, the brightness control, the test
# suite and the driver itself.
#
# Split into two jobs on purpose. Everything except the driver needs only a
# compiler and the ordinary Windows SDK, both of which the hosted runners
# already have, so that job is dependable. The driver additionally needs the
# Windows Driver Kit, which has to be installed on the fly and is by far the
# most fragile step here. Keeping them apart means a problem installing the
# kit does not hide a genuine compile error in everything else.

name: windows

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tools:
    name: tool, brightness control and tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build the console tool
        shell: cmd
        run: usbdisplay\scripts\build-tool.bat

      - name: Build the brightness control
        shell: cmd
        run: usbdisplay\scripts\build-tray.bat

      - name: Build the brightness probe
        shell: cmd
        run: usbdisplay\scripts\build-probe.bat

      - name: Run the tests
        shell: cmd
        run: usbdisplay\scripts\test.bat

      - name: Check the tool runs
        shell: cmd
        # No adapter is attached to a build machine, so this only proves the
        # binary starts and its offline checks pass. The commands that need
        # hardware cannot be covered here at all.
        run: |
          usbdisplay\build\usbdisplayctl.exe selftest
          usbdisplay\build\usbdisplayctl.exe plan
          usbdisplay\build\usbdisplayctl.exe modes

      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: |
            usbdisplay/build/usbdisplayctl.exe
            usbdisplay/build/usbdisplaytray.exe
            usbdisplay/build/brightnessprobe.exe
          if-no-files-found: error

  driver:
    name: driver
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Sets up the whole compiler environment, not just the build engine.
      # The step that follows calls the compiler directly, and the action
      # that only provides msbuild leaves it off the path entirely.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Report the build environment
        shell: pwsh
        # Printed before anything is attempted. Without this a failure says
        # only that a step exited non-zero, and every diagnosis becomes a
        # guess followed by another push.
        run: |
          $sdk = 'C:\Program Files (x86)\Windows Kits\10'
          Write-Host "== SDK versions present =="
          Get-ChildItem "$sdk\Include" -Directory -EA SilentlyContinue |
            ForEach-Object { Write-Host "   $($_.Name)" }
          Write-Host "== compiler =="
          $cl = Get-Command cl -EA SilentlyContinue
          Write-Host "   cl: $(if ($cl) { $cl.Source } else { 'NOT ON PATH' })"
          Write-Host "== shader compiler =="
          Get-ChildItem "$sdk\bin" -Recurse -Filter 'fxc.exe' -EA SilentlyContinue |
            ForEach-Object { Write-Host "   $($_.FullName)" }

      - name: Build the driver
        shell: pwsh
        # Compiled directly rather than through the project file.
        #
        # The project file depends on the driver build rules, which arrive
        # with a Visual Studio extension that has to be installed separately
        # and is slow and unreliable to install on a fresh machine. None of
        # it is needed: this driver links against no driver runtime at all,
        # and wants only two small static stubs from the kit, which NuGet
        # serves as an ordinary archive. That is what the Linux build
        # already does, and doing the same here means both paths exercise
        # the same reasoning rather than one hiding behind tooling.
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '10.0.26100.6584'
          $work = "$env:RUNNER_TEMP\wdk"
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          Write-Host '==> Fetching the driver kit'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$version/microsoft.windows.wdk.x64.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile "$work\wdk.zip"
          Expand-Archive -Path "$work\wdk.zip" -DestinationPath "$work\wdk" -Force

          # The package carries nine versions of each, so the ones this
          # driver targets are named rather than guessed at.
          $iddcxVersion = '1.2'
          $wdfVersion = '2.33'
          $iddcxStub = Get-ChildItem "$work\wdk" -Recurse -Filter 'iddcxstub.lib' |
            Where-Object { $_.FullName -match "iddcx\\$iddcxVersion\\" } | Select-Object -First 1
          $wdfStub = Get-ChildItem "$work\wdk" -Recurse -Filter 'WdfDriverStubUm.lib' |
            Where-Object { $_.FullName -match "umdf\\x64\\$wdfVersion\\" } | Select-Object -First 1
          $iddcxInc = Get-ChildItem "$work\wdk" -Recurse -Directory -Filter $iddcxVersion |
            Where-Object { $_.FullName -match 'Include.*um\\iddcx' } | Select-Object -First 1
          $wdfInc = Get-ChildItem "$work\wdk" -Recurse -Directory -Filter $wdfVersion |
            Where-Object { $_.FullName -match 'Include.*wdf\\umdf' } | Select-Object -First 1

          foreach ($pair in @(@('iddcxstub.lib', $iddcxStub), @('WdfDriverStubUm.lib', $wdfStub),
                              @('display extension headers', $iddcxInc), @('framework headers', $wdfInc))) {
            if (-not $pair[1]) { throw "Could not find $($pair[0]) in the driver kit package." }
          }
          Write-Host "    stubs:   $($iddcxStub.Name), $($wdfStub.Name)"
          Write-Host "    headers: $($iddcxInc.FullName)"

          Write-Host '==> Compiling the shader'
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'fxc.exe' |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }
          & $fxc.FullName /nologo /T cs_5_0 /E main /Vn kConvertComputeShader `
            /Fh "$work\convert_cs.h" usbdisplay\src\render\convert_cs.hlsl
          if ($LASTEXITCODE -ne 0) { throw 'The shader failed to compile.' }

          Write-Host '==> Compiling'
          $out = 'usbdisplay\build\driver\x64\Release'
          $obj = "$work\obj"
          New-Item -ItemType Directory -Path $out, $obj -Force | Out-Null

          $sources = @(
            'src/core/proto.cpp', 'src/core/usb.cpp', 'src/core/open_device.cpp',
            'src/core/macrosilicon.cpp', 'src/render/rect.cpp', 'src/render/damage.cpp',
            'src/render/convert.cpp', 'src/render/converter.cpp',
            'src/driver/log.cpp', 'src/driver/settings.cpp', 'src/driver/sender.cpp',
            'src/driver/pipeline.cpp', 'src/driver/device.cpp', 'src/driver/driver.cpp'
          )

          # IDDCX_VERSION_* are not derived from the include path and must be
          # stated. The kit headers are not clean at high warning levels, so
          # warnings are not errors here; the tool and the tests cover the
          # same code with warnings as errors.
          $common = @(
            '/nologo', '/std:c++17', '/EHsc', '/O2', '/MT', '/W3',
            '/DUNICODE', '/D_UNICODE', '/D_WIN32_WINNT=0x0A00',
            '/DIDDCX_VERSION_MAJOR=1', '/DIDDCX_VERSION_MINOR=2',
            '/DUMDF_VERSION_MAJOR=2', '/DUMDF_VERSION_MINOR=33',
            '/DUMDF_USING_NTSTATUS',
            "/I$($iddcxInc.FullName)", "/I$($wdfInc.FullName)", "/I$work"
          )

          foreach ($source in $sources) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($source)
            & cl @common /c "usbdisplay\$source" "/Fo$obj\$name.obj"
            if ($LASTEXITCODE -ne 0) { throw "Failed to compile $source" }
          }

          Write-Host '==> Linking'
          & link /nologo /DLL /MACHINE:X64 "/OUT:$out\usbdisplaydd.dll" `
            "$obj\*.obj" $iddcxStub.FullName $wdfStub.FullName `
            d3d11.lib dxgi.lib setupapi.lib hid.lib winusb.lib `
            advapi32.lib ole32.lib user32.lib gdi32.lib kernel32.lib `
            ntdll.lib
          if ($LASTEXITCODE -ne 0) { throw 'The driver failed to link.' }

          Write-Host '==> Building the installer'
          & cl @common /c usbdisplay\src\tools\setup\main.cpp "/Fo$obj\setup.obj"
          if ($LASTEXITCODE -ne 0) { throw 'the installer failed to compile' }
          # MANIFESTUAC:NO stops the linker adding a second, conflicting
          # manifest of its own, which makes embedding ours fail outright.
          & link /nologo /MACHINE:X64 "/OUT:$out\usbdisplay-setup.exe" `
            "$obj\setup.obj" setupapi.lib newdev.lib advapi32.lib crypt32.lib `
            cfgmgr32.lib ole32.lib shell32.lib user32.lib `
            /MANIFESTUAC:NO /MANIFEST:EMBED `
            "/MANIFESTINPUT:usbdisplay\src\tools\setup\setup.manifest"
          if ($LASTEXITCODE -ne 0) { throw 'the installer failed to link' }

          # The version in the INF must move for Windows to replace an
          # installed copy, so it is stamped the way a local build does.
          $stamp = "$(Get-Date -Format 'MM/dd/yyyy'),$(Get-Date -Format 'HH.mm.ss').0"
          (Get-Content usbdisplay\inf\usbdisplaydd.inf) -replace '^DriverVer\s*=.*', "DriverVer = $stamp" |
            Set-Content "$out\usbdisplaydd.inf"

      - name: Check what was produced
        shell: pwsh
        run: |
          $dll = 'usbdisplay\build\driver\x64\Release\usbdisplaydd.dll'
          if (-not (Test-Path $dll)) { throw "No driver binary at $dll" }
          $info = Get-Item $dll
          Write-Host ("built {0}, {1:N0} bytes" -f $info.Name, $info.Length)

      - uses: actions/upload-artifact@v4
        with:
          name: driver
          path: |
            usbdisplay/build/driver/x64/Release/usbdisplaydd.dll
            usbdisplay/build/driver/x64/Release/usbdisplaydd.inf
            usbdisplay/build/driver/x64/Release/usbdisplay-setup.exe
          if-no-files-found: error

  release:
    name: release
    # On a Windows machine only because the two tools that build and sign a
    # driver catalog are Microsoft's own and have no equivalent elsewhere.
    # Everything else here, assembling and publishing, would run anywhere.
    # Running them under emulation on Linux was considered and rejected: the
    # catalog tool is a 32 bit program, so it would need an emulator and a
    # second architecture, and signing is the last place to want a
    # translation layer between the tool and what it produces.
    needs: [tools, driver]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble a package that can actually be installed
        shell: pwsh
        # Catalogs are generated and signed here rather than on the user's
        # machine.
        #
        # Installing a driver package needs a catalog, and generating one
        # needs two tools that ship with the Windows SDK. Requiring those of
        # somebody who only wants their second monitor to work is not
        # reasonable, and it is the difference between a release that can be
        # installed and a pile of files that cannot.
        #
        # The signature is a certificate generated here and thrown away, so
        # it proves nothing about origin. That is stated plainly in the
        # release notes rather than glossed over: the installer still has to
        # add it to the machine's trusted stores, and anyone installing this
        # should understand that is what they are agreeing to.
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'package'
          New-Item -ItemType Directory -Path "$stage\driver", "$stage\winusb", "$stage\tools" -Force | Out-Null

          # Each package needs its INF and every file it names together in
          # one directory, which is what the catalog tool expects.
          Copy-Item artifacts\driver\usbdisplaydd.dll "$stage\driver\"
          Copy-Item artifacts\driver\usbdisplaydd.inf "$stage\driver\"
          Copy-Item usbdisplay\inf\usbdisplay_winusb.inf "$stage\winusb\"
          Copy-Item artifacts\tools\* "$stage\tools\"
          # The installer sits at the top, where somebody unpacking the
          # archive will find it without being told.
          Copy-Item artifacts\driver\usbdisplay-setup.exe "$stage\" 

          # The two tools are downloaded rather than looked for.
          #
          # Neither is reliably present on a build machine: the catalog tool
          # ships with the driver kit, which is not installed here, and
          # hunting for the other one across whatever happens to be on disk
          # is the kind of assumption that works until the image changes.
          # Both are published on NuGet, which is a plain file server, so
          # fetching them takes seconds and gives the same versions every
          # time.
          $version = '10.0.26100.6584'
          $tools = "$env:RUNNER_TEMP\signing-tools"
          New-Item -ItemType Directory -Path $tools -Force | Out-Null

          foreach ($package in @(
              @{ Id = 'microsoft.windows.wdk.x64';        Dir = 'wdk' },
              @{ Id = 'microsoft.windows.sdk.buildtools'; Dir = 'sdk' })) {
            $archive = "$tools\$($package.Dir).zip"
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://api.nuget.org/v3-flatcontainer/$($package.Id)/$version/$($package.Id).$version.nupkg" `
              -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath "$tools\$($package.Dir)" -Force
            Remove-Item $archive
          }

          # The catalog tool is a 32 bit program, which matters only in that
          # it rules out running any of this under emulation elsewhere.
          $inf2cat = Get-ChildItem "$tools\wdk" -Recurse -Filter 'Inf2Cat.exe' | Select-Object -First 1
          $signtool = Get-ChildItem "$tools\sdk" -Recurse -Filter 'signtool.exe' |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $inf2cat) { throw 'Inf2Cat.exe was not in the driver kit package.' }
          if (-not $signtool) { throw 'signtool.exe was not in the build tools package.' }
          Write-Host "inf2cat:  $($inf2cat.FullName)"
          Write-Host "signtool: $($signtool.FullName)"

          # The certificate is built through the .NET types rather than the
          # certificate cmdlets. Those need a provider that is not present
          # on every machine, and where it is missing they fail complaining
          # about a missing drive, which explains nothing. Signing from a
          # file also avoids touching the machine's certificate stores at
          # all, which a build has no business doing.
          Add-Type -AssemblyName System.Security
          $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            'CN=usbdisplay release ${{ github.ref_name }}',
            [System.Security.Cryptography.RSA]::Create(2048),
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $true))
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new('DigitalSignature', $true))
          $purpose = [System.Security.Cryptography.OidCollection]::new()
          [void]$purpose.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))  # code signing
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($purpose, $true))

          $cert = $request.CreateSelfSigned(
            [DateTimeOffset]::UtcNow.AddDays(-1), [DateTimeOffset]::UtcNow.AddYears(5))
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          $password = [Guid]::NewGuid().ToString()
          [IO.File]::WriteAllBytes($pfx, $cert.Export('Pfx', $password))

          foreach ($dir in 'driver', 'winusb') {
            & $inf2cat.FullName /driver:"$stage\$dir" /os:10_X64,10_RS3_ARM64
            if ($LASTEXITCODE -ne 0) { throw "catalog generation failed for $dir" }
            Get-ChildItem "$stage\$dir" -Include '*.cat', '*.dll' -Recurse | ForEach-Object {
              & $signtool.FullName sign /q /fd sha256 /f $pfx /p $password $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signing failed on $($_.Name)" }
            }
          }
          Remove-Item $pfx -Force

          # The certificate travels with the package: the installer has to
          # trust it before Windows will accept either driver.
          [IO.File]::WriteAllBytes((Join-Path $stage 'usbdisplay.cer'), $cert.Export('Cert'))

          Copy-Item usbdisplay\scripts\install.ps1 "$stage\"
          Copy-Item usbdisplay\scripts\purge.ps1 "$stage\"
          Copy-Item usbdisplay\scripts\reattach.ps1 "$stage\"
          Copy-Item usbdisplay\README.md "$stage\"
          Copy-Item LICENSE "$stage\"

          Compress-Archive -Path "$stage\*" `
            -DestinationPath "usbdisplay-${{ github.ref_name }}.zip"
          Write-Host "packaged:"
          Get-ChildItem -Recurse $stage | ForEach-Object { Write-Host "   $($_.FullName.Replace((Get-Location).Path,''))" }

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: usbdisplay-${{ github.ref_name }}.zip
          body: |
            Unpack it, then from an elevated PowerShell:

                .\install.ps1

            No reboot and no change to Windows' signing policy are needed.
            Nothing here loads into the kernel, so all Windows asks for is a
            package signed by a certificate it trusts. It works with Secure
            Boot on. It does need administrator rights.

            **About the signature.** These files are signed with a
            certificate generated when the release was built and then
            discarded. It proves the files have not been altered since, and
            nothing whatever about who made them. Installing means telling
            your machine to trust that certificate, which is a real decision
            and not a formality: if you would rather not, build from source
            instead, which is a supported path and documented in the README.

            After installing, run `tools\usbdisplaytray.exe` for brightness,
            and right-click its icon for "Start with Windows".

            `usbdisplayctl.exe list` and `info` work without installing
            anything and are the first thing to try if the adapter is not
            recognised.
