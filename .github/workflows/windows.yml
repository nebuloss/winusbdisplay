# SPDX-License-Identifier: GPL-2.0-only
#
# The Windows half of the build: the tool, the brightness control, the test
# suite and the driver itself.
#
# Split into two jobs on purpose. Everything except the driver needs only a
# compiler and the ordinary Windows SDK, both of which the hosted runners
# already have, so that job is dependable. The driver additionally needs the
# Windows Driver Kit, which has to be installed on the fly and is by far the
# most fragile step here. Keeping them apart means a problem installing the
# kit does not hide a genuine compile error in everything else.
#
# This workflow publishes nothing. Releases are built on Linux, catalogs and
# signatures included; see .github/workflows/linux.yml. What this one is for
# is catching a difference between the two toolchains, which is a real risk
# and not one a Linux-only build can see.

name: windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tools:
    name: tool, brightness control and tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build the console tool
        shell: cmd
        run: usbdisplay\scripts\build-tool.bat

      - name: Build the brightness control
        shell: cmd
        run: usbdisplay\scripts\build-tray.bat

      - name: Build the brightness probe
        shell: cmd
        run: usbdisplay\scripts\build-probe.bat

      - name: Run the tests
        shell: cmd
        run: usbdisplay\scripts\test.bat

      - name: Check the tool runs
        shell: cmd
        # No adapter is attached to a build machine, so this only proves the
        # binary starts and its offline checks pass. The commands that need
        # hardware cannot be covered here at all.
        run: |
          usbdisplay\build\usbdisplayctl.exe selftest
          usbdisplay\build\usbdisplayctl.exe plan
          usbdisplay\build\usbdisplayctl.exe modes

      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: |
            usbdisplay/build/usbdisplayctl.exe
            usbdisplay/build/usbdisplaytray.exe
            usbdisplay/build/brightnessprobe.exe
          if-no-files-found: error

  driver:
    name: driver
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Sets up the whole compiler environment, not just the build engine.
      # The step that follows calls the compiler directly, and the action
      # that only provides msbuild leaves it off the path entirely.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Report the build environment
        shell: pwsh
        # Printed before anything is attempted. Without this a failure says
        # only that a step exited non-zero, and every diagnosis becomes a
        # guess followed by another push.
        run: |
          $sdk = 'C:\Program Files (x86)\Windows Kits\10'
          Write-Host "== SDK versions present =="
          Get-ChildItem "$sdk\Include" -Directory -EA SilentlyContinue |
            ForEach-Object { Write-Host "   $($_.Name)" }
          Write-Host "== compiler =="
          $cl = Get-Command cl -EA SilentlyContinue
          Write-Host "   cl: $(if ($cl) { $cl.Source } else { 'NOT ON PATH' })"
          Write-Host "== shader compiler =="
          Get-ChildItem "$sdk\bin" -Recurse -Filter 'fxc.exe' -EA SilentlyContinue |
            ForEach-Object { Write-Host "   $($_.FullName)" }

      - name: Build the driver
        shell: pwsh
        # Compiled directly rather than through the project file.
        #
        # The project file depends on the driver build rules, which arrive
        # with a Visual Studio extension that has to be installed separately
        # and is slow and unreliable to install on a fresh machine. None of
        # it is needed: this driver links against no driver runtime at all,
        # and wants only two small static stubs from the kit, which NuGet
        # serves as an ordinary archive. That is what the Linux build
        # already does, and doing the same here means both paths exercise
        # the same reasoning rather than one hiding behind tooling.
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '10.0.26100.6584'
          $work = "$env:RUNNER_TEMP\wdk"
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          Write-Host '==> Fetching the driver kit'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$version/microsoft.windows.wdk.x64.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile "$work\wdk.zip"
          Expand-Archive -Path "$work\wdk.zip" -DestinationPath "$work\wdk" -Force

          # The package carries nine versions of each, so the ones this
          # driver targets are named rather than guessed at.
          $iddcxVersion = '1.2'
          $wdfVersion = '2.33'
          $iddcxStub = Get-ChildItem "$work\wdk" -Recurse -Filter 'iddcxstub.lib' |
            Where-Object { $_.FullName -match "iddcx\\$iddcxVersion\\" } | Select-Object -First 1
          $wdfStub = Get-ChildItem "$work\wdk" -Recurse -Filter 'WdfDriverStubUm.lib' |
            Where-Object { $_.FullName -match "umdf\\x64\\$wdfVersion\\" } | Select-Object -First 1
          $iddcxInc = Get-ChildItem "$work\wdk" -Recurse -Directory -Filter $iddcxVersion |
            Where-Object { $_.FullName -match 'Include.*um\\iddcx' } | Select-Object -First 1
          $wdfInc = Get-ChildItem "$work\wdk" -Recurse -Directory -Filter $wdfVersion |
            Where-Object { $_.FullName -match 'Include.*wdf\\umdf' } | Select-Object -First 1

          foreach ($pair in @(@('iddcxstub.lib', $iddcxStub), @('WdfDriverStubUm.lib', $wdfStub),
                              @('display extension headers', $iddcxInc), @('framework headers', $wdfInc))) {
            if (-not $pair[1]) { throw "Could not find $($pair[0]) in the driver kit package." }
          }
          Write-Host "    stubs:   $($iddcxStub.Name), $($wdfStub.Name)"
          Write-Host "    headers: $($iddcxInc.FullName)"

          Write-Host '==> Compiling the shader'
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'fxc.exe' |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK.' }
          & $fxc.FullName /nologo /T cs_5_0 /E main /Vn kConvertComputeShader `
            /Fh "$work\convert_cs.h" usbdisplay\src\render\convert_cs.hlsl
          if ($LASTEXITCODE -ne 0) { throw 'The shader failed to compile.' }

          Write-Host '==> Compiling'
          $out = 'usbdisplay\build\driver\x64\Release'
          $obj = "$work\obj"
          New-Item -ItemType Directory -Path $out, $obj -Force | Out-Null

          $sources = @(
            'src/core/proto.cpp', 'src/core/usb.cpp', 'src/core/open_device.cpp',
            'src/core/macrosilicon.cpp', 'src/render/rect.cpp', 'src/render/damage.cpp',
            'src/render/convert.cpp', 'src/render/converter.cpp',
            'src/render/overlay.cpp',
            'src/driver/log.cpp', 'src/driver/settings.cpp', 'src/driver/sender.cpp',
            'src/driver/graphics.cpp', 'src/driver/cursor.cpp',
            'src/driver/pipeline.cpp', 'src/driver/device.cpp', 'src/driver/driver.cpp'
          )

          # IDDCX_VERSION_* are not derived from the include path and must be
          # stated. The kit headers are not clean at high warning levels, so
          # warnings are not errors here; the tool and the tests cover the
          # same code with warnings as errors.
          $common = @(
            '/nologo', '/std:c++17', '/EHsc', '/O2', '/MT', '/W3',
            '/DUNICODE', '/D_UNICODE', '/D_WIN32_WINNT=0x0A00',
            '/DIDDCX_VERSION_MAJOR=1', '/DIDDCX_VERSION_MINOR=2',
            '/DUMDF_VERSION_MAJOR=2', '/DUMDF_VERSION_MINOR=33',
            '/DUMDF_USING_NTSTATUS',
            "/I$($iddcxInc.FullName)", "/I$($wdfInc.FullName)", "/I$work"
          )

          foreach ($source in $sources) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($source)
            & cl @common /c "usbdisplay\$source" "/Fo$obj\$name.obj"
            if ($LASTEXITCODE -ne 0) { throw "Failed to compile $source" }
          }

          Write-Host '==> Linking'
          & link /nologo /DLL /MACHINE:X64 "/OUT:$out\usbdisplaydd.dll" `
            "$obj\*.obj" $iddcxStub.FullName $wdfStub.FullName `
            d3d11.lib dxgi.lib setupapi.lib hid.lib winusb.lib `
            advapi32.lib ole32.lib user32.lib gdi32.lib kernel32.lib `
            ntdll.lib
          if ($LASTEXITCODE -ne 0) { throw 'The driver failed to link.' }

          Write-Host '==> Building the driver installation step'
          & cl @common /c usbdisplay\src\tools\setup\main.cpp "/Fo$obj\setup.obj"
          if ($LASTEXITCODE -ne 0) { throw 'the driver step failed to compile' }
          # MANIFESTUAC:NO stops the linker adding a second, conflicting
          # manifest of its own, which makes embedding ours fail outright.
          & link /nologo /MACHINE:X64 "/OUT:$out\driversetup.exe" `
            "$obj\setup.obj" setupapi.lib newdev.lib advapi32.lib crypt32.lib `
            cfgmgr32.lib ole32.lib shell32.lib user32.lib `
            /MANIFESTUAC:NO /MANIFEST:EMBED `
            "/MANIFESTINPUT:usbdisplay\src\tools\setup\setup.manifest"
          if ($LASTEXITCODE -ne 0) { throw 'the driver step failed to link' }

          # The version in the INF must move for Windows to replace an
          # installed copy, so it is stamped the way a local build does.
          $stamp = "$(Get-Date -Format 'MM/dd/yyyy'),$(Get-Date -Format 'HH.mm.ss').0"
          (Get-Content usbdisplay\inf\usbdisplaydd.inf) -replace '^DriverVer\s*=.*', "DriverVer = $stamp" |
            Set-Content "$out\usbdisplaydd.inf"

      - name: Check what was produced
        shell: pwsh
        run: |
          $dll = 'usbdisplay\build\driver\x64\Release\usbdisplaydd.dll'
          if (-not (Test-Path $dll)) { throw "No driver binary at $dll" }
          $info = Get-Item $dll
          Write-Host ("built {0}, {1:N0} bytes" -f $info.Name, $info.Length)

      - uses: actions/upload-artifact@v4
        with:
          name: driver
          path: |
            usbdisplay/build/driver/x64/Release/usbdisplaydd.dll
            usbdisplay/build/driver/x64/Release/usbdisplaydd.inf
            usbdisplay/build/driver/x64/Release/driversetup.exe
          if-no-files-found: error

