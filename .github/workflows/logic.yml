# SPDX-License-Identifier: GPL-2.0-only
#
# The quick half of the build.
#
# Only the logic is checked here: the protocol, the damage planner, the cost
# model and the colour conversion. That is roughly the part where a mistake
# is silent, so it is worth checking on every push, and it happens to be the
# part that does not need Windows at all.
#
# The driver itself cannot be built here, now or ever, because it needs the
# Windows driver kit, the indirect display stub library and a shader
# compiler, none of which exist off Windows. That job belongs to the
# workflow next door.
#
# Two compilers, because each forgives different mistakes. Anything that
# builds cleanly under both is unlikely to be relying on one of them being
# generous.

name: logic

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Install ${{ matrix.compiler }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $([ "${{ matrix.compiler }}" = "clang++" ] && echo clang || echo g++)

      - name: Build and run the tests
        working-directory: usbdisplay
        env:
          CXX: ${{ matrix.compiler }}
        run: make test

  sanitised:
    # The same tests again with the address and undefined behaviour
    # checkers switched on. Worth a separate job: these catch the kind of
    # fault that otherwise shows up as a display glitch on somebody's desk
    # rather than as a failing test.
    name: tests with checks enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run under the sanitisers
        working-directory: usbdisplay
        env:
          CXX: clang++
          CXXFLAGS: >-
            -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror
            -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: make test
