# SPDX-License-Identifier: GPL-2.0-only
#
# The whole project, built on Linux.
#
# Including the driver, which is the part usually assumed to need Windows.
# It does not: a user-mode driver of this kind is an ordinary DLL that links
# against no driver runtime at all, both the framework and the display
# extension being bound at load time through function tables. The only
# things needed from the driver kit are two small static stubs and some
# headers, and all of it is published on NuGet, which is a plain file
# server.
#
# The Windows workflow is still the one that matters for a release, because
# only it can sign a package and check the driver actually starts. This one
# exists to give a complete answer in a couple of minutes on every push,
# rather than waiting on a Windows machine to install a driver kit.

name: linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $([ "${{ matrix.compiler }}" = "clang++" ] && echo clang || echo g++)

      - name: Build and run the tests
        working-directory: usbdisplay
        env:
          CXX: ${{ matrix.compiler }}
        run: make test

  sanitised:
    # The same tests with the address and undefined behaviour checkers on.
    # Worth its own job: these catch the sort of fault that otherwise shows
    # up as a display glitch on somebody's desk rather than as a red build.
    name: tests with checks enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang

      - name: Build and run under the sanitisers
        working-directory: usbdisplay
        env:
          CXX: clang++
          CXXFLAGS: >-
            -std=c++17 -O1 -g -Wall -Wextra -Werror
            -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: make test

  driver:
    name: driver, cross compiled
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        # A current clang, from the LLVM project's own packages.
        #
        # The runner image carries 16, 17 and 18, and the Microsoft standard
        # library refuses anything older than 19 by static assertion. Ubuntu
        # will not have a newer one for some time, so it comes from
        # upstream. Everything else the build needs, the compiler runtime,
        # the Windows SDK and the driver kit, is downloaded by the script.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip lsb-release wget software-properties-common gnupg file
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19
          sudo apt-get install -y --no-install-recommends lld-19

      - name: Cache the downloaded Microsoft toolchain
        # It is a few hundred megabytes and does not change between runs.
        uses: actions/cache@v4
        with:
          path: usbdisplay/build/cross/toolchain
          key: msvc-toolchain-x86_64-desktop-v1

      - name: Report the toolchain
        # Printed before anything is attempted, so a failure names the wrong
        # assumption rather than only an exit code.
        run: |
          echo "== compilers =="
          for t in clang clang-19 clang-cl lld lld-19 lld-link lld-link-19 ld.lld; do
            printf '   %-10s %s\n' "$t" "$(command -v $t || echo 'not present')"
          done
          echo "== versions =="
          clang-19 --version 2>/dev/null | head -1 || clang --version 2>/dev/null | head -1 || true

      - name: Cross compile the driver
        working-directory: usbdisplay
        run: |
          chmod +x scripts/cross-build.sh
          ./scripts/cross-build.sh

      - name: Check what came out
        working-directory: usbdisplay
        # A Windows driver built on Linux deserves more than a file
        # existence check. This confirms it is a 64 bit Windows library
        # that exports the entry point the framework calls and asks for the
        # libraries a working driver asks for. Anything less would pass for
        # a file that merely linked without complaint.
        run: |
          dll=build/driver/x64/Release/usbdisplaydd.dll
          test -f "$dll" || { echo "no driver was produced"; exit 1; }

          echo "== what it is =="
          file "$dll"
          file "$dll" | grep -q 'PE32+' || {
            echo "that is not a 64 bit Windows library"; exit 1; }

          echo
          echo "== what it exports =="
          # The framework finds a driver through this one symbol. Without
          # it the driver loads and is then never called.
          if command -v llvm-readobj >/dev/null 2>&1; then
            llvm-readobj --coff-exports "$dll" | tee exports.txt
            grep -q 'FxDriverEntryUm' exports.txt || {
              echo "the framework entry point is missing"; exit 1; }
          else
            echo "llvm-readobj not available, skipping"
          fi

          echo
          echo "== what it needs =="
          if command -v llvm-readobj >/dev/null 2>&1; then
            llvm-readobj --coff-imports "$dll" | grep -i 'Name:' | sort -u
          fi

          ls -la "$dll"

      - uses: actions/upload-artifact@v4
        with:
          name: driver-cross-compiled
          path: |
            usbdisplay/build/driver/x64/Release/usbdisplaydd.dll
            usbdisplay/build/driver/x64/Release/usbdisplaydd.inf
          if-no-files-found: error
