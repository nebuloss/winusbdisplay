# SPDX-License-Identifier: GPL-2.0-only
#
# The whole project, built on Linux.
#
# Including the driver, which is the part usually assumed to need Windows.
# It does not: a user-mode driver of this kind is an ordinary DLL that links
# against no driver runtime at all, both the framework and the display
# extension being bound at load time through function tables. The only
# things needed from the driver kit are two small static stubs and some
# headers, and all of it is published on NuGet, which is a plain file
# server.
#
# The release is built here too, catalogs and signatures included. That is
# the part usually assumed to need Windows twice over, and it does not
# either; scripts/make-catalog.sh explains how and why.
#
# The Windows workflow still builds and tests everything natively, which is
# what catches a difference between the two toolchains. It no longer
# publishes anything.

name: linux

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $([ "${{ matrix.compiler }}" = "clang++" ] && echo clang || echo g++)

      - name: Build and run the tests
        working-directory: usbdisplay
        env:
          CXX: ${{ matrix.compiler }}
        run: make test

  sanitised:
    # The same tests with the address and undefined behaviour checkers on.
    # Worth its own job: these catch the sort of fault that otherwise shows
    # up as a display glitch on somebody's desk rather than as a red build.
    name: tests with checks enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang

      - name: Build and run under the sanitisers
        working-directory: usbdisplay
        env:
          CXX: clang++
          CXXFLAGS: >-
            -std=c++17 -O1 -g -Wall -Wextra -Werror
            -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: make test

  driver:
    name: driver, cross compiled
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        # A current clang, from the LLVM project's own packages.
        #
        # The runner image carries 16, 17 and 18, and the Microsoft standard
        # library refuses anything older than 19 by static assertion. Ubuntu
        # will not have a newer one for some time, so it comes from
        # upstream. Everything else the build needs, the compiler runtime,
        # the Windows SDK and the driver kit, is downloaded by the script.
        #
        # osslsigncode is what signs the result. It is an ordinary Ubuntu
        # package and has been able to sign driver catalogs since 2022.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip lsb-release wget software-properties-common gnupg file zip osslsigncode
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 19
          sudo apt-get install -y --no-install-recommends lld-19

      - name: Cache the downloaded Microsoft toolchain
        # It is a few hundred megabytes and does not change between runs.
        uses: actions/cache@v4
        with:
          path: usbdisplay/build/cross/toolchain
          key: msvc-toolchain-x86_64-desktop-v1

      - name: Report the toolchain
        # Printed before anything is attempted, so a failure names the wrong
        # assumption rather than only an exit code.
        run: |
          echo "== compilers =="
          for t in clang clang-19 clang-cl lld lld-19 lld-link lld-link-19 ld.lld; do
            printf '   %-10s %s\n' "$t" "$(command -v $t || echo 'not present')"
          done
          echo "== versions =="
          clang-19 --version 2>/dev/null | head -1 || clang --version 2>/dev/null | head -1 || true

      - name: Cross compile the driver
        working-directory: usbdisplay
        run: |
          chmod +x scripts/cross-build.sh
          ./scripts/cross-build.sh

      - name: Check what came out
        working-directory: usbdisplay
        # A Windows driver built on Linux deserves more than a file
        # existence check. This confirms it is a 64 bit Windows library
        # that exports the entry point the framework calls and asks for the
        # libraries a working driver asks for. Anything less would pass for
        # a file that merely linked without complaint.
        run: |
          dll=build/driver/x64/Release/usbdisplaydd.dll
          test -f "$dll" || { echo "no driver was produced"; exit 1; }

          echo "== what it is =="
          file "$dll"
          file "$dll" | grep -q 'PE32+' || {
            echo "that is not a 64 bit Windows library"; exit 1; }

          echo
          echo "== what it exports =="
          # The framework finds a driver through this one symbol. Without
          # it the driver loads and is then never called.
          if command -v llvm-readobj >/dev/null 2>&1; then
            llvm-readobj --coff-exports "$dll" | tee exports.txt
            grep -q 'FxDriverEntryUm' exports.txt || {
              echo "the framework entry point is missing"; exit 1; }
          else
            echo "llvm-readobj not available, skipping"
          fi

          echo
          echo "== what it needs =="
          if command -v llvm-readobj >/dev/null 2>&1; then
            llvm-readobj --coff-imports "$dll" | grep -i 'Name:' | sort -u
          fi

          echo
          echo "== the installer =="
          setup=build/usbdisplay-setup.exe
          test -f "$setup" || { echo "no installer was produced"; exit 1; }
          file "$setup"
          # The manifest is what makes Windows ask for permission rather than
          # the program failing without it, so its presence is worth checking
          # rather than assuming.
          grep -q 'requireAdministrator' "$setup" || {
            echo "the installer will not ask for administrator rights"; exit 1; }
          ls -la "$setup"

          echo
          echo "== the tools =="
          # Both ship in the release, so both are checked here rather than
          # discovered missing by somebody unpacking the archive.
          for tool in build/usbdisplayctl.exe build/usbdisplaytray.exe; do
            test -f "$tool" || { echo "$tool was not built"; exit 1; }
            file "$tool" | grep -q 'PE32+' || {
              echo "$tool is not a 64 bit Windows program"; exit 1; }
            ls -la "$tool"
          done

          ls -la "$dll"

      - name: Catalog and sign the packages
        # Run on every push, not only on a tag. Signing is the step a release
        # cannot do without and the one nobody exercises until the day they
        # need it, so it is proved continuously rather than discovered
        # broken under a tag.
        working-directory: usbdisplay
        run: |
          chmod +x scripts/make-catalog.sh scripts/package.sh
          ./scripts/package.sh "${GITHUB_REF_NAME/\//-}"

      - name: Check the catalogs are what Windows will be given
        # A catalog that parses is not a catalog that works, but a catalog
        # that does not parse certainly does not, and the alternative is
        # finding out from a machine that can only say "the package is
        # unsigned".
        working-directory: usbdisplay
        run: |
          for cat in build/package/driver/*.cat build/package/winusb/*.cat; do
            echo "== $cat"
            test -s "$cat" || { echo "empty"; exit 1; }
            # The content type that makes this a certificate trust list
            # rather than any other PKCS#7 structure.
            openssl asn1parse -inform der -in "$cat" 2>/dev/null |
              grep -q '1.3.6.1.4.1.311.10.1' || {
                echo "not a certificate trust list"; exit 1; }
            # And that something actually signed it.
            osslsigncode verify -in "$cat" 2>&1 | grep -i 'signature' | head -5 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: usbdisplay-package
          path: usbdisplay/build/usbdisplay-*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [tests, sanitised, driver]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: usbdisplay-package

      - uses: softprops/action-gh-release@v2
        with:
          files: usbdisplay-*.zip
          body: |
            Unpack it and run `usbdisplay-setup.exe`. It asks for
            administrator rights and does the rest.

            No reboot and no change to Windows' signing policy are needed.
            Nothing here loads into the kernel, so all Windows asks for is a
            package signed by a certificate it trusts. It works with Secure
            Boot on.

            **About the signature.** These files are signed with a
            certificate generated when the release was built and then
            discarded. It proves the files have not been altered since, and
            nothing whatever about who made them. Installing means telling
            your machine to trust that certificate, which is a real decision
            and not a formality: if you would rather not, build from source
            instead, which is a supported path and documented in the README.

            After installing, run `tools\usbdisplaytray.exe` for brightness,
            and right-click its icon for "Start with Windows".
